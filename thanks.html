<body>
  <main id="main">
    <section class="page-hero" style="min-height:70svh">
      <div class="container">
        <p class="eyebrow">Request received</p>
        <h1 class="section-title">It&rsquo;s on the <em>bench list.</em></h1>
        <p class="lead" id="thanks-lead">Thank you — your assessment request is in. We&rsquo;ll come back to you quickly with an honest answer. If it&rsquo;s urgent, call <a href="tel:7034377446">703-437-7446</a>.</p>
        <script>
          (function () {
            var m = window.location.search.match(/[?&]type=(trade|commercial|insurance|government)/);
            if (typeof window.gtag === 'function') {
              window.gtag('event', 'form_submit_complete', { inquiry_type: m ? m[1] : 'residential' });
            }
            if (!m) return;
            var lead = document.getElementById('thanks-lead');
            var copy = {
              trade: 'Thank you — your trade inquiry is in. Designer and trade requests go to the front of the reply queue; expect to hear from the workshop directly. If the install date is close, call ',
              commercial: 'Thank you — your commercial inquiry is in. We’ll reply with next steps for scoping the project, including a site visit where it helps. To talk it through sooner, call ',
              insurance: 'Thank you — your claim inquiry is in. We’ll reply with what we need to document the damage for your adjuster. If the piece is wet or smoke-exposed, don’t wait on us — call ',
              government: 'Thank you — your procurement inquiry is in. We’ll reply with our capability information and next steps. For time-sensitive solicitations, call '
            };
            if (lead && copy[m[1]]) {
              lead.innerHTML = copy[m[1]] + '<a href="tel:7034377446">703-437-7446</a>.';
            }
          })();
        </script>
        <div style="margin-top:2rem; display:flex; gap:1rem; flex-wrap:wrap">
